# Four 1080p cameras (light semantic pipeline, 30 fps) beside Qwen2.5-1.5B F16
# answering a short, grammar-constrained request every 1.6 s (the paper's
# camera case).  Profiled result: profiles/orin_nano_super/light4cam_qwen25_1p5b_f16.
#   tools/edgepace profile examples/workloads/light4cam_qwen25_1p5b_f16.toml
# Relative paths are relative to this file.

name = "light4cam_qwen25_1p5b_f16"

[platform]
power_mode = "MAXN_SUPER"
default_conf = "../../platform/orin_nano_super_default.conf"
video_clocks = "dynamic"

[foreground]
command = "../../build/foreground/fourcam_light --video {repo}/media/test_1080p30_hevc.mp4 --frames {frames} --warmup-frames 12 --period-us 33333 --deadline-us 33333 --condition llm --output {phase_dir}/foreground.csv --semantic-output {phase_dir}/semantic_records.csv --task-page {task_page} --progress-page {progress_page} --active-cameras 4 --partial-camera-period 0"
period_ms = 33.333
deadline_ms = 33.333

[llm]
model = "../../models/qwen2.5-1.5b-instruct-fp16.gguf"
plan = ""
request = "../../requests/text_4tok.json"
period_ms = 1600
align = "frame"
max_tokens = 4
freshness_ms = 1800
parallel = 1
extra_streams = 0
context_size = 2048

[profile]
mode = "quick"            # foreground alone + beside the unmanaged LLM, quick_frames each
quick_frames = 600
# throughput first: H 10 kept ~70% of the LLM throughput at ~3.7% misses on the Orin Nano
# Super (H 12: 68% / 3.1%, H 16: 65% / 1.6%; 2026-10-26, paper parameters, 3 runs each);
# for fewer misses raise it, or let mode = "sweep" pick H by objective / min_retention
horizon_ms = 10
objective = "miss"
min_retention = 0.6
miss_budget = 0.02
horizons = [12, 16, 20, 24]
frames = 1800
sweep_frames = 900
stress_binary = "../../build/stress/gpu_stress"
